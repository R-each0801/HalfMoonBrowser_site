# ================================================================
# ダイヤルの内容 (アプリの HalfMoonBrowser/Models/DialAction.swift と
# DialConfiguration.swift の default に合わせる)
# ここを直すと ダイヤル操作ページの「初期配置」の図と「並べられる操作」の一覧が更新される。
# ================================================================

# 初期配置 (上から順)
defaults:
  left:    [ページ最上部, 新規タブ, サブメニュー, ブックマーク追加, ページ最下部]
  right:   [検索・URL, 戻る, ホーム, 進む, タブを閉じる]
  submenu: [タブ一覧, 共有, ページ内検索, 広告を消す, 自動スクロール, 設定]

# 並べられる操作 (アプリの「項目を追加」と同じ順・同じ説明)
groups:
  - name: ページの移動
    actions:
      - { name: 戻る, desc: 1ページ戻る }
      - { name: 進む, desc: 1ページ進む }
      - { name: 更新, desc: このページを読み込み直す }
      - { name: ホーム, desc: スタートページへ戻る }
      - { name: 検索・URL, desc: URL 入力・検索 }
  - name: タブ
    actions:
      - { name: 新規タブ, desc: 新しいタブを開く }
      - { name: タブ移動, desc: 次のタブへ切り替え }
      - { name: タブを閉じる, desc: このタブを閉じる }
      - { name: タブ一覧, desc: 開いているタブを一覧 }
      - { name: 下部タブ一覧, desc: 画面下部のタブ一覧を表示/非表示 }
      - { name: 下部操作バー, desc: 画面下部の操作バーを表示/非表示 }
  - name: ページの操作
    actions:
      - { name: ブックマーク追加, desc: スタートページに追加 }
      - { name: 共有, desc: 他のアプリで共有 }
      - { name: ページ内検索, desc: ページ内の文字を検索 }
      - { name: リーダー, desc: 本文のみで読む }
      - { name: 翻訳, desc: ページを翻訳 }
      - { name: ページ最上部, desc: ページの最上部へ一気に移動 }
      - { name: ページ最下部, desc: ページの最下部へ一気に移動 }
      - { name: 自動スクロール, desc: ページを自動スクロール }
      - { name: PC 表示切替, desc: PC 版とスマホ版を切替 }
      - { name: 拡大, desc: ページを拡大表示 }
      - { name: 縮小, desc: ページを縮小表示 }
  - name: 表示
    actions:
      - { name: ライト/ダーク切替, desc: Web 表示をライト/ダークで切替 }
      - { name: スーパーダーク, desc: 画面全体を暗く切替 }
  - name: 広告とプライバシー
    actions:
      - { name: 広告を消す, desc: タップで要素を非表示 }
      - { name: サイト別広告ブロック, desc: このサイトの広告ブロックを切替 }
      - { name: プライベート切替, desc: プライベートに切替 }
      - { name: データ消去, desc: 全タブと Cookie・キャッシュを消去 }
  - name: その他
    actions:
      - { name: 左右入れ替え, desc: 左右のダイヤルを入れ替える }
      - { name: 履歴, desc: 見たページの履歴 }
      - { name: 設定, desc: アプリの設定を開く }
      - { name: サブメニュー, desc: 他の項目を開く }
